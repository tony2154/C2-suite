{% extends "base.html" %}

{% block title %}Túneles{% endblock %}

{% block content %}
<div class="section-header">
    <h2><i class="fas fa-network-wired"></i> Túneles C2</h2>
</div>

<div class="tunnel-tabs">
    <button class="tab-btn active" onclick="showTab('dns')">DNS Tunnel</button>
    <button class="tab-btn" onclick="showTab('icmp')">ICMP Tunnel</button>
</div>

<div id="dns-tab" class="tab-content active">
    <h3>Queries DNS</h3>
    <table class="data-table">
        <thead>
            <tr><th>Bot ID</th><th>Dominio</th><th>Tipo</th><th>Datos</th><th>Resuelto</th><th>Fecha</th></tr>
        </thead>
        <tbody id="dns-tbody"></tbody>
    </table>
</div>

<div id="icmp-tab" class="tab-content">
    <h3>Paquetes ICMP</h3>
    <table class="data-table">
        <thead>
            <tr><th>Bot ID</th><th>Src IP</th><th>Dst IP</th><th>Tipo</th><th>Datos</th><th>Fecha</th></tr>
        </thead>
        <tbody id="icmp-tbody"></tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script>
function showTab(tab) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
    document.getElementById(tab + '-tab').classList.add('active');
    event.target.classList.add('active');
}

async function loadTunnels() {
    try {
        const [dnsResp, icmpResp] = await Promise.all([
            fetch('/api/panel/dns'),
            fetch('/api/panel/icmp')
        ]);
        const dns = await dnsResp.json();
        const icmp = await icmpResp.json();
        
        document.getElementById('dns-tbody').innerHTML = dns.map(d => `
            <tr>
                <td>${d.bot_id ? d.bot_id.substring(0,12)+'...' : 'N/A'}</td>
                <td><code>${d.domain}</code></td>
                <td>${d.query_type}</td>
                <td><pre>${d.data}</pre></td>
                <td>${d.resolved || '-'}</td>
                <td>${new Date(d.timestamp).toLocaleString()}</td>
            </tr>
        `).join('');
        
        document.getElementById('icmp-tbody').innerHTML = icmp.map(i => `
            <tr>
                <td>${i.bot_id ? i.bot_id.substring(0,12)+'...' : 'N/A'}</td>
                <td>${i.src_ip}</td>
                <td>${i.dst_ip}</td>
                <td>${i.packet_type}</td>
                <td><pre>${i.data}</pre></td>
                <td>${new Date(i.timestamp).toLocaleString()}</td>
            </tr>
        `).join('');
    } catch(e) {}
}

loadTunnels();
setInterval(loadTunnels, 10000);
</script>
{% endblock %}
